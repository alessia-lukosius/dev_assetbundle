# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 09c06a76-7af3-4daa-9423-7e16f89b0701

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5895c5c5-5b26.cloud.databricks.com
    variables:
      catalog: dev_dab
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-5895c5c5-5b26.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/alessia.lukosius@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alessia.lukosius@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_dab
      schema: prod
    permissions:
      - user_name: alessia.lukosius@hotmail.com
        level: CAN_MANAGE
